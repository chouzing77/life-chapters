<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>闪光点探索机 · 周紫晴</title><link rel="stylesheet" href="play.css"></head><body><header class="page-head"><a href="./#cyber">← 返回正经版</a><span>PLAYABLE CHAPTER / 03</span></header><main><section class="console" aria-label="像素游戏机"><div class="left-grip"><span class="led"></span><span class="micro">LIFE<br>CHAPTERS</span><div class="dpad"><button data-action="jump" class="up" aria-label="向上跳跃">▲</button><button data-action="left" class="left" aria-label="向左行走">◀</button><i></i><button data-action="right" class="right" aria-label="向右行走">▶</button><button data-action="down" class="down" aria-label="查看附近已发现的星星">▼</button></div><span class="micro">MOVE / JUMP</span></div><div class="screen-shell"><div class="hud"><span>✦ <b id="count">0</b> / 5</span><span id="state">准备出发</span><button id="sound" aria-label="关闭音效" aria-pressed="false">音效：开</button><button id="pause" aria-label="暂停游戏">Ⅱ</button></div><div id="screen" tabindex="0" role="application" aria-label="项目探索游戏，左右方向键移动，上方向键或空格跳跃，下方向键查看已发现星星，Escape暂停"><div id="world"><div class="skyline"></div><div class="moon"></div><div id="blocks"></div><div id="stars"></div><div id="player"><img src="assets/cyber-still.png" alt="赛博主角"></div><div class="ground"></div><div class="sign start">START →</div><div class="sign finish">想象，没有终点 ✦</div></div><div id="start-panel"><button id="start">开始探索 ▶</button></div></div><div class="screen-bottom"><span>CYBER EXPLORER</span><span>NO GAME OVER · ONLY DISCOVERY</span></div></div><div class="right-grip"><span class="micro">CREATE<br>WITH CURIOSITY</span><button class="action-button" data-action="jump" aria-label="A键跳跃">A</button><button class="action-button secondary" data-action="down" aria-label="B键查看已发现星星">B</button><div class="speaker">▰ ▰ ▰</div></div></section><div class="below"><p>键盘 ← → 行走 · ↑ / 空格 跳跃 · ↓ 查看 · Esc 暂停<br>也可以长按方向按钮，用 A 跳跃，用 B 查看。</p><button id="reset">重新探索 ↻</button></div><section class="collection"><div><h2>我的星光收藏</h2><p id="progress" role="status">还没有发现星星。第一颗就在前方。</p></div><div id="collection-list"></div></section></main><dialog id="project-dialog" aria-labelledby="project-name"><button id="close-dialog" aria-label="关闭项目介绍">×</button><span class="dialog-kicker">STAR DISCOVERED / 项目档案</span><h2 id="project-name"></h2><div id="project-body"></div><button id="continue">继续探索 →</button></dialog><script src="play.js"></script></body></html>
